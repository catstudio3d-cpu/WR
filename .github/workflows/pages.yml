name: Deploy WildRide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Select static website
        id: static
        shell: bash
        run: |
          if [ -f dist/index.html ]; then
            echo "directory=dist" >> "$GITHUB_OUTPUT"
          elif [ -f wildride-academy-site/dist/index.html ]; then
            echo "directory=wildride-academy-site/dist" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot find WildRide static files" >&2
            exit 1
          fi
      - name: Name this build artifact
        id: artifact
        shell: bash
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.static.outputs.directory }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
